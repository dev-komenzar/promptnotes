# scenario manifest — SSoT（人間が書く）。new-scenario.js が scaffold する。
#
# scenario id は .ori/domain/validation.md の H2 section anchor と 1:1
# （例: `## Scenario S1: ... {#s1-note-created-happy}` → scenario id = s1-note-created-happy）。
# rename 禁止。field 仕様の SSoT: instructions/scenario.instructions.md §manifest-schema。
scenario_id: "s12-startup-state"
type: scenario
derives_from:
  # 必須: この scenario が anchor する validation section（1:1）
  - domain/validation.md#s12-startup-state
  # 関連 workflow / aggregate / event / ui-field section
  - domain/workflows/load-settings.md#load-settings
  - domain/workflows/list-feed.md#list-feed
  - domain/workflows/change-sort-order.md#change-sort-order
  - domain/workflows/update-feed-filter.md#update-feed-filter
  - domain/aggregates.md#settings-aggregate
  - domain/aggregates.md#note-feed-aggregate
  - domain/domain-events.md#sort-preference-changed
  - domain/ui-fields/screen-1.md#screen-1
# ---- optional fields（詳細は scenario.instructions.md §manifest-schema）----
pages:
  - page-main
infrastructure:       # 参加者（app 名 + infra 名。起動方法は runtime / infra catalog から解決）
  services:
    - promptnotes
