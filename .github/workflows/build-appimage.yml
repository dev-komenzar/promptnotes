name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.1)'
        required: false

# Linux release build. Must have TAURI_SIGNING_PRIVATE_KEY and
# _PASSWORD repository secrets configured (see ori-l2rv.1). Without them
# the build fails because createUpdaterArtifacts requires the signing key.

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: |
          curl -fsSL https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz | tar xzf - -C ~/.cargo/bin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/promptnotes/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: apps/promptnotes
        run: bun install --frozen-lockfile

      # tauri-action が build → draft Release 作成 → bundle / .sig / latest.json の
      # upload までを行う。tauri build 単体は latest.json を生成しない。
      # 既存 Release に latest.json があれば platforms をマージする。
      - name: Build and release Linux bundles (AppImage + deb + rpm)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/promptnotes
          tauriScript: bun run tauri
          args: --bundles deb,appimage,rpm
          tagName: v__VERSION__
          releaseName: PromptNotes v__VERSION__
          releaseDraft: true
          generateReleaseNotes: true
