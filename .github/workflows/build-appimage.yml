name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.1)'
        required: false

env:
  APP_NAME: PromptNotes
  TAURI_DIR: apps/promptnotes/src-tauri

# Linux release build. Must have TAURI_SIGNING_PRIVATE_KEY and
# _PASSWORD repository secrets configured (see ori-l2rv.1). Without them
# the build will succeed but .AppImage.sig will NOT be generated and the
# in-app updater will refuse to update (signature verification fail).

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: |
          curl -fsSL https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz | tar xzf - -C ~/.cargo/bin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/promptnotes/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: apps/promptnotes
        run: bun install --frozen-lockfile

      - name: Get version from tauri.conf.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('${{ env.TAURI_DIR }}/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build Linux bundles (AppImage + deb + rpm)
        working-directory: apps/promptnotes
        run: bun run tauri build --bundles deb,appimage,rpm
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # tauri CLI (`tauri build`) は .sig までしか作らず、latest.json は
      # tauri-action 専用の生成物。ここで各 bundle の .sig から組み立てる。
      - name: Generate latest.json
        working-directory: ${{ env.TAURI_DIR }}/target/release/bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          base = f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}"
          targets = {
              "linux-x86_64": "appimage/*.AppImage",
              "linux-x86_64-deb": "deb/*.deb",
              "linux-x86_64-rpm": "rpm/*.rpm",
          }
          platforms = {}
          for key, pattern in targets.items():
              (artifact,) = glob.glob(pattern)
              with open(artifact + ".sig") as f:
                  signature = f.read().strip()
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{os.path.basename(artifact)}",
              }
          latest = {
              "version": os.environ["VERSION"],
              "notes": f"PromptNotes v{os.environ['VERSION']}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          PY
          cat latest.json

      - name: Verify updater artifacts
        run: |
          ls -la apps/promptnotes/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          ls -la apps/promptnotes/src-tauri/target/release/bundle/deb/*.deb.sig
          ls -la apps/promptnotes/src-tauri/target/release/bundle/rpm/*.rpm.sig
          ls -la apps/promptnotes/src-tauri/target/release/bundle/latest.json

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: PromptNotes-${{ steps.version.outputs.version }}-AppImage
          path: apps/promptnotes/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: PromptNotes-${{ steps.version.outputs.version }}-deb
          path: apps/promptnotes/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v5
        with:
          name: PromptNotes-${{ steps.version.outputs.version }}-rpm
          path: apps/promptnotes/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PromptNotes v${{ steps.version.outputs.version }}
          files: |
            apps/promptnotes/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/promptnotes/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/promptnotes/src-tauri/target/release/bundle/deb/*.deb
            apps/promptnotes/src-tauri/target/release/bundle/deb/*.deb.sig
            apps/promptnotes/src-tauri/target/release/bundle/rpm/*.rpm
            apps/promptnotes/src-tauri/target/release/bundle/rpm/*.rpm.sig
            apps/promptnotes/src-tauri/target/release/bundle/latest.json
          draft: true
          generate_release_notes: true
